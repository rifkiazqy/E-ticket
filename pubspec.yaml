name: flutter_application_1
description: "A new Flutter project."

# Mencegah proyek dipublikasikan ke pub.dev
publish_to: 'none'

# Versi aplikasi
version: 1.0.0+1

environment:
  sdk: ^3.9.2

# 🔹 Dependencies (package yang dibutuhkan proyek)
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  loading_animation_widget: ^1.3.0
  provider: ^6.1.1
  animations: ^2.0.11
  intl: ^0.20.2
  getwidget: ^7.0.0
  webview_flutter: ^4.13.0
  device_info_plus: ^12.2.0
  shared_preferences: ^2.5.3

# 🔹 Dev dependencies (alat bantu pengujian & linting)
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# 🔹 Pengaturan khusus Flutter
flutter:

  # Agar bisa pakai ikon Material
  uses-material-design: true

  # 🔹 Daftar aset gambar yang digunakan dalam aplikasi
  assets:
    - assets/images/logo.png
    - assets/images/background.png
    - assets/images/ucl.png
    - assets/images/uefa.png
    - assets/images/pildun.png
    - assets/images/king.png
    - assets/images/club/
    - assets/images/

  # 🔹 Contoh kalau nanti ingin menambahkan font custom (opsional)
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
